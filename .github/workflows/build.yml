name: Build SADEE DIMA Apps
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle :userApp:assembleDebug
      - run: gradle :adminApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-User-APK
          path: userApp/build/outputs/apk/debug/userApp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-Admin-APK
          path: adminApp/build/outputs/apk/debug/adminApp-debug.apk
