name: Build SADEE DIMA Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build User APK
        run: gradle :userApp:assembleDebug

      - name: Build Admin APK
        run: gradle :adminApp:assembleDebug

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-User-APK
          path: userApp/build/outputs/apk/debug/userApp-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-Admin-APK
          path: adminApp/build/outputs/apk/debug/adminApp-debug.apk
