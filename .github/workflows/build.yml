name: Build SADEE DIMA Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build User APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :userApp:assembleDebug

      - name: Build Admin APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :adminApp:assembleDebug

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-User-APK
          path: "${{ env.PROJECT_DIR }}/userApp/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-Admin-APK
          path: "${{ env.PROJECT_DIR }}/adminApp/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
