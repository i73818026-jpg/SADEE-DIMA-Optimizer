name: Build SADEE DIMA Optimizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          set -e

          echo "=== Repository ==="
          ls -la

          unzip -q "SADEE_DIMA_Optimizer_COMPLETE_GitHub_Actions.zip" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -type f | sort

      - name: Locate Gradle project
        run: |
          set -e

          PROJECT_DIR=$(find extracted -name settings.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check project
        run: |
          echo "=== PROJECT ==="
          cd "$PROJECT_DIR"

          ls -la

          echo "=== APP ==="
          ls -la app

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Project structure OK"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          cd "$PROJECT_DIR"

          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-Optimizer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
